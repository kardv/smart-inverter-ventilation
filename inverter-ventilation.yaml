esphome:
  name: inverter-ventilation
  friendly_name: Inverter Ventilation
  platformio_options:
    board_build.flash_mode: dout

  on_boot:
    priority: -10  # Ensures this runs after the switches restore their state
    then:
      - if:
          condition:
            switch.is_on: relay_exhaust
          then:
            - light.turn_on: led_exhaust
          else:
            - light.turn_off: led_exhaust
      - if:
          condition:
            fan.is_on: relay_cooling_fan
          then:
            - light.turn_on: led_cooling_fan
          else:
            - light.turn_off: led_cooling_fan

esp8266:
  board: d1_mini

button:
  - platform: restart
    name: "Restart Device"

debug:
  update_interval: 10s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Last Reset Reason"
  - platform: template
    name: "WiFi Dongle Uptime"    
    lambda: |-
      uint32_t seconds = id(raw_uptime_sensor).state;
      uint32_t days = seconds / (24 * 3600);
      seconds %= (24 * 3600);
      uint32_t hours = seconds / 3600;
      seconds %= 3600;
      uint32_t minutes = seconds / 60;
      return { (std::to_string(days) + "d " + std::to_string(hours) + "h " + std::to_string(minutes) + "m").c_str() };

script:
  - id: turn_off_exhaust
    mode: restart # Restarting ensures the timer starts fresh every time the button is pressed
    then:
      - delay: 2000ms
      - switch.turn_off: relay_exhaust
      
  - id: turn_off_fan
    mode: restart # Restarting ensures the timer starts fresh every time the button is pressed
    then:
      - delay: 2000ms
      - fan.turn_off: relay_cooling_fan      

# ------------------------
# RELAYS
# ------------------------
switch:
  - platform: gpio
    icon: "mdi:hvac"
    pin:
      number: GPIO14   # D5
      inverted: false
    id: relay_exhaust
    name: "Room Exhaust"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - light.turn_on: led_exhaust
    on_turn_off:
      - light.turn_off: led_exhaust

fan:
  - platform: speed
    icon: "mdi:fan-plus"
    output: cooling_pwm
    name: "Cooling Fan"
    restore_mode: RESTORE_DEFAULT_OFF
    id: relay_cooling_fan
    speed_count: 5
    on_turn_on:
      - light.turn_on: led_cooling_fan
      # Manual Startup Kick (if fans struggle to start at 20%)
      - output.set_level:
          id: cooling_pwm
          level: 100%
      - delay: 500ms
      # This returns it to the selected speed after the kickstart
      - output.set_level:
          id: cooling_pwm
          level: !lambda "return id(relay_cooling_fan).speed / 5.0;"      
    on_turn_off:
      - light.turn_off: led_cooling_fan
      - output.set_level:
          id: cooling_pwm
          level: 0%

# ------------------------
# BUTTONS (MANUAL CONTROL)
# ------------------------
binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO4   # D2
      mode: INPUT_PULLUP
      inverted: true
    name: "Exhaust Button"
    filters:
      - delayed_on: 50ms    # debounce
      - delayed_off: 50ms
    id: relay_exhaust_button_id
    on_click:
      - min_length: 50ms
        max_length: 2000ms
        then:
          - switch.toggle: relay_exhaust
      - min_length: 3000ms
        max_length: 5000ms
        then:
          - switch.turn_off: relay_exhaust
    
  - platform: gpio
    internal: true
    pin:
      number: GPIO0   # D3
      mode: INPUT_PULLUP
      inverted: true
    name: "Cooling Fan Button"
    filters:
      - delayed_on: 50ms
    id: relay_cooling_fan_button_id
    on_press:
      then:
        - script.execute: turn_off_fan # Start the 2s timer
    
    # --- WHEN YOU RELEASE THE BUTTON ---
    on_release:
      then:
        - if:
            condition:
              # Check if the shutdown script is STILL RUNNING
              script.is_running: turn_off_fan
            then:
              - script.stop: turn_off_fan # Stop the timer!
              # Perform the Single Click logic
              - if:
                  condition:
                    fan.is_off: relay_cooling_fan
                  then:
                    - fan.turn_on:
                        id: relay_cooling_fan
                        speed: 1 
                  else:
                    - if:
                        condition:
                          lambda: 'return id(relay_cooling_fan).speed == 5;'
                        then:
                          - fan.turn_on:
                              id: relay_cooling_fan
                              speed: 1
                        else:
                          - fan.cycle_speed: relay_cooling_fan
            else:
              - logger.log: "Release after long press - doing nothing."
    
# ------------------------
# OUTPUTS
# ------------------------
output:
  - platform: esp8266_pwm
    pin: 
      number: GPIO13 # D7
      inverted: false
    id: cooling_pwm
    frequency: 25000 Hz

  - platform: gpio
    pin: GPIO12   # D6
    id: led_cooling_fan_output

  - platform: gpio
    pin: GPIO16   # D0
    id: led_exhaust_output

# ------------------------
# LED LIGHTS (STATE INDICATORS)
# ------------------------
light:
  - platform: binary
    id: led_cooling_fan
    output: led_cooling_fan_output
    internal: false
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: binary
    id: led_exhaust
    output: led_exhaust_output
    internal: false
    restore_mode: RESTORE_DEFAULT_OFF
    
# ------------------------
# BOOT / STATUS LED ANIMATION
# ------------------------
status_led:
  pin:
    number: GPIO2
    inverted: false

# ------------------------
# ONE WIRE BUS
# ------------------------
one_wire:
  - platform: gpio
    pin: GPIO05

# ------------------------
# SENSORS
# ------------------------
sensor:
  - platform: uptime
    id: raw_uptime_sensor
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free RAM"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"
    cpu_frequency:
      name: "CPU Frequency"  

  # TEMPERATURE
  - platform: dallas_temp
    name: "Room Temperature"
    address: 0xe53ce10457e28f28              
    id: room_temperature
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # WIFI SIGNAL SENSOR
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 10s

# COMMON
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "YOUR_GENERATE_API_ENCRYPTION_KEY_HERE"

ota:
  - platform: esphome
    password: "YOUR_SECURE_OTA_PASSWORD_HERE"

wifi:
  min_auth_mode: WPA2
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password      
  
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Smart Inverter Ventilation"
    password: "YOUR_FALLBACK_AP_PASSWORD"

captive_portal:
